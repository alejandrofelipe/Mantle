# Mantle -- Access Transformer (MC 1.21.1 / NeoForge, mojmap names)
#
# Only the members the ported code actually needs are listed. The old 1.20 SRG-named
# entries were dropped: most of those accesses were rewritten to public 1.21 APIs during
# the port, and SRG names (f_xxx_/m_xxx_) do not resolve under NeoForge's mojmap mappings.

# LootTableInjection reads and reassigns the pool's entry list (private final) at load time
public-f net.minecraft.world.level.storage.loot.LootPool entries

# MultiModuleScreen repositions each WrapperSlot onto its parent's live position; Slot.x/y are final in 1.21
public-f net.minecraft.world.inventory.Slot x # xPos
public-f net.minecraft.world.inventory.Slot y # yPos

# ExtraHeartRenderHandler reads/advances the vanilla HUD layout cursor to position the custom health rows
public-f net.minecraft.client.gui.Gui leftHeight

# BookCommand exports book pages by recording them into the game's GUI render state and drawing it with the game's GUI renderer,
# which holds the registered picture-in-picture renderers; the empty fog buffer is what the game passes when drawing the GUI
# (26.1.2: the GUI render state moved into GameRenderer#getGameRenderState(), which is public)
public net.minecraft.client.renderer.GameRenderer guiRenderer
public net.minecraft.client.renderer.GameRenderer fogRenderer

# 26.1.2: imageWidth/imageHeight are final (set by the 5-arg constructor); MultiModuleScreen/BackgroundContainerScreen and
# Tinkers' responsive station screens resize the screen at runtime (D-SCREEN)
protected-f net.minecraft.client.gui.screens.inventory.AbstractContainerScreen imageWidth
protected-f net.minecraft.client.gui.screens.inventory.AbstractContainerScreen imageHeight

# GenericTextureGenerator encodes generated textures to PNG bytes for the data cache (NativeImage only writes PNGs to files publicly)
public com.mojang.blaze3d.platform.NativeImage writeToChannel(Ljava/nio/channels/WritableByteChannel;)Z

# ShapedRetexturedRecipe reads the base recipe's result directly; going through display() streams ingredient contents,
# which fails at datagen for tag/custom ingredients whose tags are not bound yet
public-f net.minecraft.world.item.crafting.ShapedRecipe result
